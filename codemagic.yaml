workflows:
  android-debug:
    name: SZXVPN Android Debug
    max_build_duration: 30

    environment:
      vars:
        PACKAGE_NAME: "com.example.sshpayloadvpn"

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x gradlew

      - name: Check project structure
        script: |
          echo "=== Project ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== App ==="
          ls -la app

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      scripts:
        - name: Build completed
          script: |
            echo "========================================"
            echo " SZXVPN DEBUG BUILD COMPLETED"
            echo " APK:"
            find app/build/outputs/apk/debug -name "*.apk" -print
            echo "========================================"
