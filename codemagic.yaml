workflows:
  android-debug:
    name: SZXVPN Android Debug
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check project
        script: |
          echo "Checking Android project..."
          ls -la
          ls -la app

      - name: Prepare Gradle
        script: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is missing"
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/apk/**/*.aab

    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
        notify:
          success: true
          failure: true
