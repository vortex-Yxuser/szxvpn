workflows:
  android-debug:
    name: SZXVPN Android Debug
    max_build_duration: 30
    instance_type: linux_x2

    scripts:
      - name: Check project
        script: |
          echo "=== Project ==="
          pwd
          ls -la
          echo "=== Gradle ==="
          ls -la gradlew
          ./gradlew --version

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        notify:
          success: true
          failure: true
