Enterworkflows:
  android-debug:
    name: Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.example.sshpayloadvpn"
      android_signing:
        - debug_keystore

    scripts:
      - name: Check project
        script: |
          echo "Project files:"
          ls -la
          echo "App files:"
          ls -la app

      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
